overview: |-
  At Cloudflare I led product discovery and 0-to-1 development of Campaign Manager, an internal tool that brings the fragmented information sales teams use to run campaigns into one place. It was also my move from software engineering into product management.

  I defined and designed an AI-powered campaign management tool supporting $50M/year in sales operations. I collected insights through competitive benchmarking and 18 user interviews, and translated the pain points into a PRD. The research started as two smaller tools; the interviews narrowed it to one more impactful solution. Then I built the MVP rapidly with Claude AI and improved it using stakeholder input, serving as the sole PM, engineer, and designer.

