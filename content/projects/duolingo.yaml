title: "Duolingo Case Study"
category: "Product Case Study"
tagline: "Keeping goal-driven learners past week one, by giving them control over what and how fast they learn."
image: "🦉"
featured: true
featuredBlurb: "A self-directed product case study: why Duolingo’s next growth lever is subscribers, why Day 7–30 retention is the KPI to move, and three features that give goal-driven learners autonomy, prioritized and paired with an A/B test plan."
stats:
  role: "Product case study"
  team: "Solo"
  course: "Self project"
links:
  - label: "Read the full case study (PDF)"
    href: "https://drive.google.com/file/d/1n0jdHLYHw_9_-mK7ZSFcW7HZfe1KttX0/view?usp=drive_link"

sections:
  - type: "full_width_text"
    content: "How might we design or reimagine a Duolingo feature that improves a key metric like retention, engagement, or learning progress, through user-centered design?"

  - type: "text_block"
    heading: "Where Duolingo Stands"
    content: "Duolingo’s mission is to develop the best education in the world and make it universally available, in a personalized and fun way. Its product leans on a freemium model with global language offerings, adaptive AI-driven lessons, and gamified, bite-sized learning, and its growth strategy has three parts: grow users, teach better, and grow subscribers.\n\nIn a highly competitive language-learning market, that gamified and personalized approach has made Duolingo the clear leader, with roughly 57.5% of the market against Mondly (16.1%), Busuu (15.5%), and Memrise (8%)."

  - type: "grid_stats"
    items:
      - value: "57.5%"
        label: "Approximate market share"
        desc: "Of language-learning apps"
      - value: "116.7M"
        label: "Monthly active users"
        desc: "Q4 2024, +32% year over year"
      - value: "40.5M"
        label: "Daily active users"
        desc: "Q4 2024, up from 26.9M"
      - value: "9.5M"
        label: "Subscribers"
        desc: "Q4 2024, up from 6.6M"

  - type: "chart"
    chartType: "grouped_bar"
    title: "Users are growing fast. The share who pay is not."
    content: "Monthly users grew 32% year over year, while subscriber penetration (subscribers as a share of monthly users) stayed nearly flat at roughly 8%, which points to limited premium conversion. Source: Duolingo shareholder letter, Q4 / FY 2024."
    yLabel: "Millions"
    unit: "M"
    legend: ["Q4 2023", "Q4 2024"]
    data:
      - label: "Monthly active users"
        before: 88.4
        after: 116.7
      - label: "Daily active users"
        before: 26.9
        after: 40.5
      - label: "Subscribers"
        before: 6.6
        after: 9.5

  - type: "process_steps"
    heading: "The Goal: Grow Subscribers"
    items:
      - title: "Monthly user"
        desc: "Duolingo already wins here. Expanding the user base is going strongly."
      - title: "Engaged daily user"
        desc: "Turning a monthly user into an engaged daily one is something product changes can move directly."
      - title: "Subscriber"
        desc: "Daily-to-paid conversion depends mostly on pricing, marketing, and premium benefits, which product changes influence less."

  - type: "highlight_box"
    heading: "Chosen KPI: Day 7 to Day 30 retention"
    content: "This is the critical mid-term window where most potential subscribers are lost. Users still active after Day 7 are high-intent learners, but many churn before Day 30 because their needs aren’t met. Keeping them engaged longer grows the pool that can convert to paid."

  - type: "info_grid"
    heading: "Two Learners, Two Journeys"
    cols: 2
    items:
      - icon: "headphones"
        label: "The hobbyist"
        title: "Lin, 21, student at Stanford"
        desc: "Learning Korean for fun, driven by K-pop. Practices 5 to 7 times a week for 5 to 10 minutes on the bus. Enjoys streaks and XP, focuses on basic phrases over grammar, and is unlikely to go premium. Pain points: hearts and energy limits feel punitive, repetition causes burnout, and streak guilt pressures her to protect the streak over real learning."
        tags: ["Hobby", "Gamification fan", "Unlikely to pay"]
      - icon: "briefcase"
        label: "The professional"
        title: "Jia, 35, consultant in India"
        desc: "Learning German because she moves to Germany for work in four months. Practices 3 to 5 evenings a week for 15 to 20 minutes, wants fluency through focused practice and error correction, and is likely to pay for in-depth learning. Pain points: the course doesn’t match her goal of business conversation, the path is too rigid to control difficulty or pace, and repetition and gamification blunt her sense of progress."
        tags: ["Goal-driven", "Time-bound", "Likely to pay"]

  - type: "image_block"
    image: "/images/duolingo/journey.jpg"
    caption: "Both start strong. Lin stays because of the streak; Jia drifts away in the Day 7 to 30 window because the app isn’t teaching her what she needs."

  - type: "highlight_box"
    heading: "Why design for Jia"
    content: "Jia’s pain points are severe enough to cause churn, goal-oriented learners like her are the ones most likely to pay for premium, and fixing her experience has the highest impact on both engagement and conversion. Hobbyists like Lin have milder pain points, and streaks and gamification already keep them around."

  - type: "feature_list"
    heading: "What Jia Needs That Duolingo Lacks"
    features:
      - title: "Goal mismatch"
        desc: "Jia wants conversational German for client meetings, business phrases first. Duolingo starts every learner on letters, sounds, and basic words, with no focused path for a specific goal."
      - title: "Rigid progression"
        desc: "After one week she doesn’t feel challenged and wants to raise the difficulty. Questions feel repetitive, and there is no way to customize intensity, so progress feels stalled."
      - title: "Progress stagnancy"
        desc: "She wants measurable milestones that reflect real language mastery. Duolingo tracks XP and streaks, not progress toward proficiency."

  - type: "info_grid"
    heading: "Three Solutions: Giving Learners Autonomy"
    cols: 3
    items:
      - icon: "gauge"
        label: "Priority 1"
        title: "Tracking and adjusting course goals"
        desc: "A weekly progress tracker shows cumulative progress and progress toward this week’s goal. Behavior-based nudges suggest a lower intensity when targets are missed, a higher one when lessons are flawless, and a choice either way when engagement drops. A 5-level intensity slider in the profile (default level 3) adjusts question difficulty and weekly goals."
      - icon: "git-branch"
        label: "Priority 2"
        title: "Branching learning paths"
        desc: "After a week of fundamentals, learners pick a focused path: Business, Academics, Travel, Daily Life, or All-in-One. Each path runs from basics to advanced; learners can go as deep as they like and switch anytime, resuming where they left off. Level 5 in All-in-One counts as Level 5 in every path."
      - icon: "list-checks"
        label: "Priority 3"
        title: "Course type selection"
        desc: "Right after choosing a language, learners pick a focus: Talk It Out (speaking and listening), Read & Write, or Everything Mode (balanced, selected by default). It can be changed later from the profile, the same way learners switch languages."

  - type: "image_block"
    image: "/images/duolingo/mockups.jpg"
    caption: "Mockups: the weekly goal tracker with a “Want to go faster?” nudge, course type selection at onboarding, and the branching path picker after the fundamentals."

  - type: "text_block"
    heading: "Prioritization"
    content: "Each feature was placed on an impact and effort matrix, with Day 7 to 30 retention as the yardstick."
    listItems:
      - "Priority 1, tracking and adjusting course goals: low effort (simple UI, rules-based nudges triggered from telemetry) and high impact, since it drives continuous engagement and adapts intensity before progress stalls."
      - "Priority 2, branching learning paths: the highest long-term impact through personalization and control, but high effort, with a front-end and back-end revamp and new content for each path."
      - "Priority 3, course type selection: moderate effort (new onboarding flow, content tagging), but it is seen once during onboarding, so it does less for mid-term retention."

  - type: "image_block"
    image: "/images/duolingo/prioritization.jpg"
    caption: "Tracking and adjusting course goals: the highest impact for the least effort."

  - type: "highlight_box"
    heading: "The pitfall, and the mitigation"
    content: "Frequent nudges can feel intrusive and annoying. So nudges trigger only after consistent behavior is observed, and their language stays supportive, not corrective."

  - type: "text_block"
    heading: "Validating Before Building"
    content: "The aim is to validate the solution’s impact before committing resources."
    listItems:
      - "Academic research: users who monitor their progress are about 40% more likely to achieve their goals."
      - "Benchmarking: at Headspace, goal-based reminders and tracking boosted session completions by 32%."
      - "Duolingo user study: surveys, interviews, and contextual research with a low-fidelity prototype to confirm the value with real learners."

  - type: "process_steps"
    heading: "A/B Test Plan"
    items:
      - title: "Cohort A: Control"
        desc: "No goal tracker and no goal-adjusting nudges."
      - title: "Cohort B"
        desc: "The goal tracker only, without nudges."
      - title: "Cohort C"
        desc: "Both the goal tracker and goal-adjusting nudges."

  - type: "text_block"
    heading: "What Gets Measured"
    content: "Monthly users are split randomly into three equal cohorts, and every applicable metric is tracked across all three, which separates the effect of the tracker from the effect of the nudges."
    listItems:
      - "Primary: Day 7 to 30 retention (up) and nudge acceptance rate (up)."
      - "Secondary: premium conversion rate (up), DAU/MAU (up), and churn rate (down)."
