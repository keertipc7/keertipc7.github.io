  spotlight:
    label: "Live demo"
    title: "Domain Authenticator"
    text: >-
      A Chrome extension that scores every domain you visit for phishing risk, using heuristics,
      Llama 3.1 on Cloudflare Workers AI, and community votes. Try the live scoring engine right here.
