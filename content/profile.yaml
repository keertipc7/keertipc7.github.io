    links:
      - label: "Read the case study"
        href: "/projects/domain-authenticator/"
      - label: "Get the extension"
        href: "https://github.com/keertipc7/domain-authenticator#install-the-extension"

# The site's arc, shown inside About as links to the matching sections.
spine:
  - title: "Ship"
    target: "experience"
    text: "Product at Cloudflare and Algozenith. Engineering at Microsoft."
  - title: "Build"
    target: "projects"
    text: "An AI security product, end to end, plus product work at CMU."
  - title: "Research"
    target: "research"
    text: "Privacy-preserving LLMs and causal structure in time series."

about:
  heading: "About me."
  paragraphs:
    - >-
      I’m a Master’s student in Integrated Innovation for Products & Services at Carnegie
      Mellon University, with a background in Mathematics and Computing from IIT Kharagpur.
    - >-
      Most recently, I interned as a Product Manager at Cloudflare, where I personally built
      and led the 0-to-1 development of an AI-powered campaign management platform supporting
      sales operations. I have previously worked as a Software Engineer at Microsoft India,
      where I honed my expertise in web development. During my undergraduate studies, I gained
      valuable experience in AI/ML through projects and thesis work, where I applied advanced
      computational methods to solve real-world problems.
    - >-
      I am passionate about building transformative technology solutions that combine my
      technical depth with product strategy and design thinking. At CMU, I am expanding my
      skills in innovation and product development to bridge the gap between technology and
      user-centric solutions.
  links:
    - label: "See where I’ve worked"
      target: "experience"
    - label: "Explore the projects"
      target: "projects"

